name: Release images
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable image tag
        required: true
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile.production
          - name: web
            context: frontend
            dockerfile: frontend/Dockerfile.production
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: "${{ matrix.context }}"
          file: "${{ matrix.dockerfile }}"
          push: true
          tags: "ghcr.io/${{ github.repository_owner }}/openrm-${{ matrix.name }}:${{ inputs.tag || github.ref_name }}"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: "ghcr.io/${{ github.repository_owner }}/openrm-${{ matrix.name }}"
          subject-digest: "${{ steps.build.outputs.digest }}"
          push-to-registry: true
