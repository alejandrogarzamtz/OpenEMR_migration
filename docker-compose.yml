services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openemr
      POSTGRES_USER: openemr
      POSTGRES_PASSWORD: openemr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openemr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://openemr:openemr@db:5432/openemr
      JWT_SECRET: local-development-secret-change-me
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:

