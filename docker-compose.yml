services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openemr
      POSTGRES_USER: openemr
      POSTGRES_PASSWORD: openemr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openemr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://openemr:openemr@db:5432/openemr
      JWT_SECRET: local-development-secret-change-me
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      PASSWORD_RESET_MINUTES: ${PASSWORD_RESET_MINUTES:-30}
      PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:-60}
      MFA_CHALLENGE_MINUTES: ${MFA_CHALLENGE_MINUTES:-5}
      IP_MAX_FAILED_LOGINS: ${IP_MAX_FAILED_LOGINS:-5}
      IP_FAILURE_WINDOW_MINUTES: ${IP_FAILURE_WINDOW_MINUTES:-15}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      PORTAL_APPOINTMENTS_ENABLED: ${PORTAL_APPOINTMENTS_ENABLED:-true}
      PORTAL_RESULTS_ENABLED: ${PORTAL_RESULTS_ENABLED:-true}
      PORTAL_DOCUMENTS_ENABLED: ${PORTAL_DOCUMENTS_ENABLED:-true}
      PORTAL_FORMS_ENABLED: ${PORTAL_FORMS_ENABLED:-true}
      PORTAL_BILLING_ENABLED: ${PORTAL_BILLING_ENABLED:-true}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
      BILLING_CURRENCY: ${BILLING_CURRENCY:-USD}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      BOOTSTRAP_ADMIN_PASSWORD: change-me-now
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
